name: mai

networks:
  edge:
    driver: bridge

volumes:
  # Mai's SQLite database (moderation queue + encrypted chat memory). The only
  # stateful artifact of the stack.
  mai-data:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-security-baseline: &security-baseline
  security_opt:
    - no-new-privileges:true
    - apparmor=docker-default
  cap_drop:
    - ALL

services:
  # ---- Mai (discord bot) ----
  mai:
    <<: *security-baseline
    build:
      context: ./mai
    image: barrax63/mai:latest
    init: true
    hostname: mai
    networks:
      - edge
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      # DATABASE_PATH must point inside this mount: everything else is
      # read-only or a tmpfs that does not survive a restart.
      - mai-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 100
        reservations:
          cpus: '0.25'
          memory: 256M
    logging: *default-logging

  # ---- Cloudflare reverse proxy (connecting to http://mai:3000) ----
  cloudflared:
    <<: *security-baseline
    image: cloudflare/cloudflared:latest
    init: true
    networks: ['edge']
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      mai:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    command: tunnel --metrics 127.0.0.1:60123 --loglevel info --no-autoupdate run
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:60123", "ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 96M
    logging: *default-logging
